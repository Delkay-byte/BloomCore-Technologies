# Netlify build settings for the static export.
# The site is fully static, so no functions or runtime are required.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# The old Netlify hostname stays reachable for existing links, but search
# engines must see one canonical site. Send every path to bloomcoretech.com.
[[redirects]]
  from = "https://bloomcore-technologies.netlify.app/*"
  to = "https://bloomcoretech.com/:splat"
  status = 301
  force = true

# Previously shared links to the old product URL keep working. Netlify applies
# this before serving the static files, so no duplicate canonical page is
# generated and nothing depends on a Next.js server.
[[redirects]]
  from = "/products/bik-prestige"
  to = "/products/maacash"
  status = 301
  force = true

[[redirects]]
  from = "/products/bloomcore-one"
  to = "/products/maacash"
  status = 301
  force = true

# NEXT_PUBLIC_SITE_URL is optional. The site now defaults to the verified
# production origin https://bloomcoretech.com in src/lib/site.ts, and rejects
# localhost, preview and *.netlify.app values so canonical metadata cannot drift.
#
# Optional owner-supplied values, set in the Netlify UI at build time:
#   NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION  Google Search Console HTML tag token
#   NEXT_PUBLIC_BING_SITE_VERIFICATION    Bing Webmaster msvalidate.01 token
# Leave either unset until the real value exists. Do not invent one.
#
# Google Tag Manager container GTM-PMZ6ZSVT and its GA4 Google tag are
# configured in source. No analytics environment variable is required.
